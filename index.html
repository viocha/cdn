<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>在线钢琴与节拍器</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
  /* 基础白键样式 */
  .white-key {
    @apply relative border-r border-b border-gray-400 w-14 h-48 flex items-end justify-center text-xs text-gray-700 cursor-pointer transition-colors duration-100 shrink-0;
  }
  /* 黑键样式 */
  /* -ml-5 (20px) 配合 JS 中的定位，使按键中心对齐白键分割线 */
  .black-key {
    @apply absolute bg-gray-900 text-white w-10 h-32 -ml-5 z-10 cursor-pointer flex items-end justify-center text-[10px] rounded-b hover:bg-gray-800 active:bg-gray-700 shadow-md border-b-2 border-gray-950;
  }
  /* 八度组容器 */
  .octave-group {
    @apply flex relative shrink-0;
  }
  
  /* 自定义滚动条样式 */
  .scrollbar-hide::-webkit-scrollbar {
      height: 12px;
  }
  .scrollbar-hide::-webkit-scrollbar-track {
      background: #e5e7eb; 
      border-radius: 4px;
  }
  .scrollbar-hide::-webkit-scrollbar-thumb {
      background: #9ca3af; 
      border-radius: 4px;
  }
  .scrollbar-hide::-webkit-scrollbar-thumb:hover {
      background: #6b7280; 
  }
</style>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="importmap">
  {
    "imports": {
      "clsx": "https://esm.sh/clsx",
      "react": "https://esm.sh/react",
      "react-dom/client": "https://esm.sh/react-dom/client?standalone&external=react"
    }
  }
</script>

<script type="text/babel" data-type="module">
  import React, { useEffect, useRef, useState, useCallback } from 'react';
  import { createRoot } from 'react-dom/client';
  import clsx from 'clsx';

  const white = ["C", "D", "E", "F", "G", "A", "B"];
  const blackMap = { C: "C#", D: "D#", F: "F#", G: "G#", A: "A#" };

  const octaveColors = [
    "bg-slate-50 hover:bg-slate-100 active:bg-slate-200",    // Group 0  A0-B0  中性灰
    "bg-rose-50 hover:bg-rose-100 active:bg-rose-200",       // Group 1  暖:玫红
    "bg-sky-100 hover:bg-sky-200 active:bg-sky-300",         // Group 2  冷:天蓝
    "bg-amber-50 hover:bg-amber-100 active:bg-amber-200",    // Group 3  暖:琥珀
    "bg-violet-100 hover:bg-violet-200 active:bg-violet-300",// Group 4  冷:紫罗兰（中央C所在组）
    "bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200", // Group 5  翠绿
    "bg-orange-50 hover:bg-orange-100 active:bg-orange-200", // Group 6  暖:橙
    "bg-indigo-100 hover:bg-indigo-200 active:bg-indigo-300",// Group 7  冷:靛蓝
    "bg-zinc-100 hover:bg-zinc-200 active:bg-zinc-300"       // Group 8  C8  中性收尾
  ];

  function buildKeyboard(){
    const keys = [];
    for(let octave=0; octave<=8; octave++){
      if(octave === 0){
        keys.push({ type:'white', name:'A0', base:'A' });
        keys.push({ type:'black', name:'A#0', base:'A' });
        keys.push({ type:'white', name:'B0', base:'B' });
        continue;
      }
      white.forEach(note => {
        if (octave === 8 && note !== 'C') return; 

        keys.push({ type:'white', name:`${note}${octave}`, base:note });
        
        if(octave !== 8 && blackMap[note]){
          keys.push({ type:'black', name:`${blackMap[note]}${octave}`, base:note });
        }
      });
    }
    return keys;
  }

  const keys = buildKeyboard();
  const audioCache = {};

  function getFileName(name) {
    return name.replace('#', 's');
  }

  function playSound(name){
    let audio = audioCache[name];
    if (!audio) {
      console.log(`Lazy loading: ${name}`);
      const fileName = getFileName(name);
      audio = new Audio(`piano-sample/${fileName}.wav`);
      audioCache[name] = audio;
    } else {
      audio.currentTime = 0; 
    }
    audio.play().catch(e => console.warn(`无法播放: ${name}`, e));
  }

  // ======================= 节拍器 =======================
  function MetronomePanel() {
    const [isPlaying, setIsPlaying] = useState(false);
    const [bpm, setBpm] = useState(75);
    const [beatsPerBar, setBeatsPerBar] = useState(4);
    const [activeBeat, setActiveBeat] = useState(-1);

    const audioCtxRef = useRef(null);
    const buffersRef = useRef({});
    const schedulerRef = useRef(null);
    const nextNoteTimeRef = useRef(0);
    const currentBeatRef = useRef(0);
    const bpmRef = useRef(75);
    const beatsRef = useRef(4);
    const isPlayingRef = useRef(false);

    useEffect(() => { bpmRef.current = bpm; }, [bpm]);
    useEffect(() => { beatsRef.current = beatsPerBar; }, [beatsPerBar]);

    // 1=强(metronome1), 2=中(metronome2), 3=弱(metronome3)
    const getBeatType = (idx, total) => {
      if (idx === 0) return 1;
      if ((total === 4 && idx === 2) || (total === 6 && idx === 3)) return 2;
      return 3;
    };

    const ensureCtx = () => {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtxRef.current;
    };

    const loadBuffers = async () => {
      const ctx = ensureCtx();
      if (Object.keys(buffersRef.current).length >= 3) return;
      await Promise.all([1, 2, 3].map(async i => {
        if (!buffersRef.current[i]) {
          const resp = await fetch(`metronome-sample/metronome${i}.wav`);
          const ab = await resp.arrayBuffer();
          buffersRef.current[i] = await ctx.decodeAudioData(ab);
        }
      }));
    };

    const runTick = useCallback(() => {
      const ctx = audioCtxRef.current;
      if (!ctx || !isPlayingRef.current) return;
      const ahead = 0.1;
      while (nextNoteTimeRef.current < ctx.currentTime + ahead) {
        const beat = currentBeatRef.current;
        const total = beatsRef.current;
        const type = (beat === 0) ? 1
          : ((total === 4 && beat === 2) || (total === 6 && beat === 3)) ? 2
          : 3;
        const buf = buffersRef.current[type];
        if (buf) {
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(nextNoteTimeRef.current);
        }
        const delay = Math.max(0, (nextNoteTimeRef.current - ctx.currentTime) * 1000);
        const capBeat = beat;
        setTimeout(() => { if (isPlayingRef.current) setActiveBeat(capBeat); }, delay);
        nextNoteTimeRef.current += 60.0 / bpmRef.current;
        currentBeatRef.current = (beat + 1) % total;
      }
      schedulerRef.current = setTimeout(runTick, 25);
    }, []);

    const doStop = useCallback(() => {
      isPlayingRef.current = false;
      clearTimeout(schedulerRef.current);
      setIsPlaying(false);
      setActiveBeat(-1);
    }, []);

    const doStart = useCallback(async () => {
      await loadBuffers();
      const ctx = ensureCtx();
      if (ctx.state === 'suspended') await ctx.resume();
      currentBeatRef.current = 0;
      nextNoteTimeRef.current = ctx.currentTime + 0.05;
      isPlayingRef.current = true;
      setIsPlaying(true);
      runTick();
    }, [runTick]);

    const handleToggle = () => {
      if (isPlayingRef.current) doStop();
      else doStart();
    };

    const handleBeatsChange = (nb) => {
      setBeatsPerBar(nb);
      beatsRef.current = nb;
      if (isPlayingRef.current) {
        doStop();
        setTimeout(() => doStart(), 50);
      }
    };

    useEffect(() => () => doStop(), [doStop]);

    const beatDots = Array.from({ length: beatsPerBar }, (_, i) => getBeatType(i, beatsPerBar));

    return (
      <div className="bg-white border-b border-gray-200 px-4 py-3 shrink-0">
        <div className="max-w-2xl mx-auto space-y-3">
          {/* 控制行 */}
          <div className="flex flex-wrap items-center justify-center gap-4">
            {/* 播放/停止 */}
            <button
              onClick={handleToggle}
              className={clsx(
                "w-28 py-2 rounded-full font-bold text-white text-sm transition-all shadow",
                isPlaying
                  ? "bg-red-500 hover:bg-red-600 active:bg-red-700"
                  : "bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700"
              )}
            >
              {isPlaying ? '⏹ 停止' : '▶ 开始'}
            </button>

            {/* BPM */}
            <div className="flex items-center gap-2">
              <span className="text-xs font-semibold text-gray-500 uppercase tracking-wide">BPM</span>
              <input
                type="range" min={30} max={240} value={bpm}
                onChange={e => setBpm(Number(e.target.value))}
                className="w-32 accent-emerald-500 cursor-pointer"
              />
              <input
                type="number" min={30} max={240} value={bpm}
                onChange={e => setBpm(Math.min(240, Math.max(30, Number(e.target.value) || 30)))}
                className="w-16 border border-gray-300 rounded-lg px-2 py-1 text-sm text-center font-mono focus:outline-none focus:border-emerald-400"
              />
            </div>

            {/* 节拍选择 */}
            <div className="flex items-center gap-2">
              <span className="text-xs font-semibold text-gray-500 uppercase tracking-wide">节拍</span>
              <div className="flex gap-1">
                {[2, 3, 4, 6].map(b => (
                  <button
                    key={b}
                    onClick={() => handleBeatsChange(b)}
                    className={clsx(
                      "w-9 h-9 rounded-full font-bold text-sm transition-all",
                      beatsPerBar === b
                        ? "bg-indigo-500 text-white shadow-md"
                        : "bg-gray-100 text-gray-600 hover:bg-gray-200"
                    )}
                  >
                    {b}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* 节拍指示灯 */}
          <div className="flex justify-center items-center gap-2 h-12">
            {beatDots.map((type, i) => (
              <div
                key={i}
                className={clsx(
                  "w-12 h-12 rounded-full flex items-center justify-center font-bold text-sm transition-colors duration-75 select-none border-2",
                  activeBeat === i
                    ? type === 1
                      ? "bg-red-500 text-white border-red-500 shadow-lg"
                      : type === 2
                        ? "bg-amber-400 text-white border-amber-400 shadow-lg"
                        : "bg-sky-400 text-white border-sky-400 shadow-lg"
                    : type === 1
                      ? "bg-red-50 text-red-300 border-red-200"
                      : type === 2
                        ? "bg-amber-50 text-amber-300 border-amber-200"
                        : "bg-gray-100 text-gray-300 border-gray-200"
                )}
              >
                {i + 1}
              </div>
            ))}
          </div>

          {/* 图例 */}
          <div className="flex justify-center gap-4 text-xs text-gray-400">
            <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full bg-red-400"></span>强</span>
            <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full bg-amber-400"></span>中</span>
            <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded-full bg-gray-300"></span>弱</span>
          </div>
        </div>
      </div>
    );
  }

  function App(){
    const scrollContainerRef = useRef(null);

    useEffect(() => {
      // 1. 预加载
      keys.forEach(k => {
        const octave = parseInt(k.name.slice(-1), 10);
        if ([3, 4, 5].includes(octave)) {
          const fileName = getFileName(k.name);
          const audio = new Audio(`piano-sample/${fileName}.wav`);
          audio.load();
          audioCache[k.name] = audio;
        }
      });

      // 2. 自动定位到 C4
      setTimeout(() => {
        const container = scrollContainerRef.current;
        const targetKey = document.getElementById('C4');

        if (container && targetKey) {
          const containerRect = container.getBoundingClientRect();
          const keyRect = targetKey.getBoundingClientRect();
          const keyOffsetInContainer = container.scrollLeft + (keyRect.left - containerRect.left);
          
          const scrollPos = keyOffsetInContainer - (container.clientWidth / 2) + (keyRect.width / 2);
          
          container.scrollTo({
            left: scrollPos,
            behavior: 'auto' 
          });
        }
      }, 50);

    }, []);

    return (
      <div className="flex flex-col h-screen bg-gray-100 overflow-hidden">
        <div className="p-4 bg-white shadow-sm z-20 shrink-0">
          <h1 className="text-center text-gray-800 font-bold text-2xl">在线钢琴与节拍器</h1>
        </div>

        <MetronomePanel />

        <div 
          ref={scrollContainerRef}
          className="flex-1 overflow-x-auto overflow-y-hidden p-8 scrollbar-hide flex items-center"
        >
             <Keyboard/>
        </div>
      </div>
    );
  }

  function Keyboard(){
    let groups = [];
    let current = [];

    keys.forEach(k => {
      if(k.name.startsWith('C') && !k.name.includes('#') && current.length > 0){
        groups.push(current);
        current = [];
      }
      current.push(k);
    });
    if(current.length > 0) groups.push(current);

    return (
      <div className="relative flex min-w-max mx-auto border-t-[12px] border-gray-800 bg-gray-900 rounded-lg shadow-2xl pl-1 pr-1 pb-1 select-none">
        {groups.map((grp, i)=>(
          <OctaveGroup 
            group={grp} 
            key={i} 
            colorClass={octaveColors[i] || "bg-white"}
          />
        ))}
      </div>
    );
  }

  function OctaveGroup({ group, colorClass }){
    const whiteKeysInThisGroup = group.filter(k => k.type === 'white');

    return (
      <div className="octave-group">
        {whiteKeysInThisGroup.map(k=>(
          <div
            key={k.name}
            id={k.name}
            onMouseDown={()=>playSound(k.name)}
            className={clsx("white-key", colorClass)}
          >
            <span className="mb-2 pointer-events-none">{k.name}</span>
          </div>
        ))}

        {group.filter(k=>k.type==='black').map(k=>{
          // 修正计算逻辑：
          // 1. 获取基准白键索引 (例如 C# 的基准是 C，索引 0)
          const baseIndex = whiteKeysInThisGroup.findIndex(w => w.base === k.base);
          
          // 2. 计算白键边缘位置： (索引 + 1) * 56px
          // 3. CSS 中有 -ml-5 (-20px)，会自动将黑键中心拉回到这条线上
          const leftPos = (baseIndex + 1) * 56; 

          return (
            <div
              key={k.name}
              onMouseDown={(e)=>{
                e.stopPropagation();
                playSound(k.name);
              }}
              className="black-key"
              style={{ left: `${leftPos}px` }}
            >
              <span className="mb-2 pointer-events-none">{k.name}</span>
            </div>
          )
        })}
      </div>
    );
  }

  createRoot(document.getElementById('root')).render(<App/>);
</script>
</head>
<body>
<div id="root"></div>
</body>
</html>
